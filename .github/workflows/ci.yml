name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pytest -q

  gate-check:
    # WS-002 dogfood: lint steward's own governance bundle on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate-check live mode reads default-branch facts from git
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run gate-check --profile team spec/
      # WS-005 bundle: the first real team-exp bundle, gated by the
      # behaviour-lifecycle checks it was born from (TODO §6b / §3).
      - run: uv run gate-check --profile team-exp workstreams/WS-005-gate-verdicts/spec/
      # steward#190 item 3: charter schema 2 + workstream-code registry, same
      # contract as devtools charter_guard (PR: against the base branch; push:
      # against the previous tip — deleting/moving a schema-2 charter is red).
      - name: charter-check
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        # A branch-creating or force push has no usable `before` (zero SHA or
        # unreachable): then the working-tree checks run without --base.
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            uv run steward charter-check --repo-name steward --base "$BASE"
          else
            uv run steward charter-check --repo-name steward
          fi
