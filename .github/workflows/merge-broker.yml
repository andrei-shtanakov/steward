# Merge-broker caller (ADR-ECO-008a). Тонкий каллер: пиненая ссылка на канонический
# исполнитель ai-orchestrators-workspace/.github/workflows/merge-broker.yml@97c84db38a38e4911699c88a2ff6e9f0cc5d6f6f.
# Код сюда НЕ копируется — предусловия мержа живут в одном месте на весь флот.
#
# Файл authority-root по I2 (он объявляет, что репозиторий делегирует право мержа) —
# сторож GOV-009 помечает его правки, и мержит их человек. Сама реализация лежит в
# зонтике за неподвижным тегом, поэтому агент не может изменить свои предусловия
# даже теоретически: чужой репозиторий плюс ruleset `governance-rule` на теги.
#
# Предпосылки в репозитории (все три — действия владельца, не кода):
#   1. merge-App установлен на репозиторий;
#   2. secret `MERGE_BROKER_APP_KEY` и variable `MERGE_BROKER_APP_ID` заведены;
#   3. App внесён в bypass ruleset'а ветки — иначе требование аппрува не пускает
#      мерж, и брокер честно упрётся в политику.
name: merge-broker

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Номер PR для мержа"
        required: true
        type: string

jobs:
  merge:
    uses: andrei-shtanakov/ai-orchestrators-workspace/.github/workflows/merge-broker.yml@97c84db38a38e4911699c88a2ff6e9f0cc5d6f6f
    with:
      pr: ${{ inputs.pr }}
      # `vars` каллера разрешается однозначно — в отличие от чтения переменных
      # внутри вызванного workflow, поэтому App ID передаётся отсюда явно.
      app-id: ${{ vars.MERGE_BROKER_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.MERGE_BROKER_APP_KEY }}
