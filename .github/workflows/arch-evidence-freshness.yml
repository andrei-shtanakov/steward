# Scheduled-НАБЛЮДЕНИЕ (guarantee B, two-contract-guarantees), НЕ PR-гейт:
# этот workflow никогда не добавлять required-чеком — прежняя формулировка
# обязательства «вне CI этого репо» значила «вне PR-гейта».
# Сессия B перехода launchd→CI (решение владельца 2026-08-06); прецедент —
# advisory-watcher dispatcher#110 (владелец вендоренных копий hostит вахту).
# Сенсор — devtools@пин, БЕЗ изменений; crash-envelope публикуется ВСЕГДА
# (if: always()): сенсор domain-статус не подделывает, оркестрация честно
# фиксирует падение исполнения. Actions запинены полными commit SHA.
name: arch-evidence-freshness

on:
  schedule:
    - cron: "40 5 * * *" # ежедневно 05:40 UTC (= 09:40 UTC+4, каденция launchd-приёмки)
  workflow_dispatch:
    inputs:
      synthetic:
        description: "Синтетический кейс: drift правит вендоренную копию в ephemeral-чекауте"
        default: "none"
        type: choice
        options: ["none", "drift"]

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: arch-evidence-freshness
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/steward
          fetch-depth: 0 # check_evidence читает git log манифеста
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrei-shtanakov/prograph
          path: ws/prograph
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrei-shtanakov/devtools
          ref: 007aac6f33f310153a08ec8ef4f9858c941af543 # devtools#29, сенсор v0.1.0
          path: ws/devtools

      - name: synthetic non-clean (только ручной прогон)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.synthetic == 'drift' }}
        run: printf '\n' >> ws/steward/contracts/prograph-intended-graph/v1/schema.json

      - name: sensor run
        id: sensor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          set +e
          python3 ws/devtools/check-arch-evidence-freshness.py \
            --workspace "$PWD/ws" --escalate \
            --status-file "$PWD/out/status.json" | tee out/sensor.log
          code=${PIPESTATUS[0]}
          echo "domain_exit=$code" >> "$GITHUB_OUTPUT"
          # красным job станет в шаге verdict — сначала публикуем evidence
          exit 0

      - name: envelope + job summary
        if: always()
        env:
          DOMAIN_EXIT: ${{ steps.sensor.outputs.domain_exit }}
        run: |
          mkdir -p out
          if [ "${DOMAIN_EXIT:-}" = "4" ] || [ ! -f out/status.json ]; then
            export EXEC_STATUS=sensor_crash
          else
            export EXEC_STATUS=completed
          fi
          python3 - <<'PY'
          import datetime
          import json
          import os

          env = os.environ
          domain = env.get("DOMAIN_EXIT") or None
          payload = {
              "schema": "arch-evidence-freshness-run/v1",
              "execution_status": env["EXEC_STATUS"],
              "domain_exit": int(domain) if domain is not None else None,
              "producer": "github-actions",
              "repository": env.get("GITHUB_REPOSITORY"),
              "workflow": env.get("GITHUB_WORKFLOW"),
              "run_id": env.get("GITHUB_RUN_ID"),
              "run_attempt": env.get("GITHUB_RUN_ATTEMPT"),
              "workflow_sha": env.get("GITHUB_SHA"),
              "event": env.get("GITHUB_EVENT_NAME"),
              "completed_at": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("out/run-envelope.json", "w") as fh:
              json.dump(payload, fh, indent=1)
          PY
          {
            echo "## arch-evidence-freshness"
            echo '```'
            cat out/status.json 2>/dev/null || echo "status.json отсутствует (sensor_crash)"
            echo '```'
            echo '```json'
            cat out/run-envelope.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Публикационные шаги — best-effort (continue-on-error): их транзиентный
      # сбой не должен красить job при чистом сенсоре. Вердикт job'а решает
      # ТОЛЬКО domain exit сенсора (финальный шаг verdict).
      - name: publish artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-evidence-freshness-status
          path: out/

      - name: check-run на steward SHA
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN_EXIT: ${{ steps.sensor.outputs.domain_exit }}
        run: |
          sha=$(git -C ws/steward rev-parse HEAD)
          if [ "${DOMAIN_EXIT:-}" = "0" ]; then conclusion=success; else conclusion=failure; fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=arch-evidence-freshness \
            -f head_sha="$sha" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=arch-evidence-freshness: domain exit ${DOMAIN_EXIT:-crash}" \
            -f "output[summary]=Наблюдение, не PR-гейт. Evidence: artifact arch-evidence-freshness-status, run ${GITHUB_RUN_ID}." \
            > /dev/null

      - name: verdict
        env:
          DOMAIN_EXIT: ${{ steps.sensor.outputs.domain_exit }}
        run: exit "${DOMAIN_EXIT:-4}"
