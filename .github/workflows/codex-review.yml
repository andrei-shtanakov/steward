# codex-review — независимое ревью дифа другой моделью (ADR-ECO-004 I3).
#
# Зачем не «ещё один линтер»: код в этом репо пишет преимущественно Claude, а I3
# говорит прямо — «a same-model/same-prompt reviewer buys ~zero independence».
# Ценность здесь ровно в том, что модель другого вендора, а рамка — опровержение.
#
# Чек, НЕ аппрув. По I3 adversarial verifier может быть «one more required-check,
# never the sole authority». Аппрув агентом — отдельный, ещё не принятый разговор.
#
# Кого блокирует: брокер требует зелёным ВЕСЬ rollup, поэтому красный чек
# останавливает агентский мерж. Человеческий путь не затронут — в ruleset этот
# чек намеренно не вносится, пока не посмотрим на качество вердиктов.
#
# Порог: красным делают только `blocker` и `major`. `minor`/`nit` уезжают в
# сводный комментарий и никого не держат — иначе контур станет ручным на каждом
# придиразме.
name: codex-review

on:
  pull_request:

permissions: {}

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Джоб 1 читает недоверенный текст (диф) и держит ключ. Поэтому у него НЕТ
  # прав на запись и НЕТ checkout'а кода PR: инъекция через содержимое PR
  # обезврежена отсутствием того, чем можно воспользоваться, а не бдительностью.
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Чтение PR (`GET /repos/{}/pulls/{}`) требует именно этого права. Сегодня
      # шаг проходит и без него, потому что репозиторий публичный, — но это
      # послабление форджа, а не наше право: закроют репо, и диф отвалится молча.
      pull-requests: read
    steps:
      # Checkout — ИТОГОВОЕ ДЕРЕВО PR, решение владельца 2026-08-23
      # (`review-kit-final-tree`): ревьюер читает настоящие версии изменённых
      # файлов и ходит по импортам, вместо того чтобы мысленно накладывать диф
      # на base — на больших патчах это был источник ложных находок.
      #
      # Ревизия — MERGE-REF (`refs/pull/N/merge`), не head: у ветки, отставшей
      # от base, в head-дереве нет base-стороны — нового caller'а или
      # регрессионного теста, добавленных в base после ответвления, — и ревью
      # по head давало бы «чисто» про дерево, которого после мержа не будет.
      # Итоговое состояние — это именно пробный мерж форджи. Цена названа:
      # при конфликте мержа ref отсутствует и чекаут падает — красный чек
      # честен (итогового дерева не существует); ref пересчитывается форджей
      # асинхронно и в редком окне может отставать от только что пушнутого
      # head — тогда прогон устаревает так же, как по любому другому пушу.
      #
      # Формула разделения: инструкции и порог — base; код для чтения —
      # итоговое дерево PR; код для исполнения — никакой. Управляющая
      # плоскость (промпт, схема, скрипты кита) извлекается из base СЛЕДУЮЩИМ
      # шагом, до любого использования дерева, — автор патча по-прежнему не
      # может переписать инструкции или порог своему же ревьюеру.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Извлечь доверенную механику из base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KIT: ${{ runner.temp }}/trusted-kit
        run: |
          set -euo pipefail

          # Объекты base достаются fetch'ем в этот же клон: чекаут выше
          # неглубокий (head), base-ревизии в нём может не быть. Файлы
          # читаются `git show <base_sha>:<путь>` — по имени ревизии, никогда
          # из рабочего дерева, которое теперь авторское.
          git fetch --quiet --depth=1 origin "$BASE_SHA"

          mkdir -p "$KIT"
          # Инструкции И ИСПОЛНЯЕМАЯ МЕХАНИКА ревьюера берутся из base
          # намеренно, и у этого есть прямое следствие: PR, который их ВВОДИТ
          # или МЕНЯЕТ, сам собой не проверяется — в base их ещё нет или они
          # другие. Это не обходится, это цена того, что автор патча не может
          # переписать промпт/склейку/порог своему же ревьюеру. Отказ должен
          # объяснять себя, иначе читается как поломка инфраструктуры.
          for f in .github/codex/review-prompt.md .github/codex/review-schema.json \
                   scripts/review/build-prompt.sh scripts/review/apply-threshold.sh \
                   scripts/review/collect-context.sh; do
            # Режим записи в дереве — как у collect-context.sh, и по той же
            # причине: у симлинка `git show` отдаёт ТЕКСТ цели, и `sh` получил
            # бы вместо скрипта одну строку-путь — каждый PR краснел бы до
            # старта ревью с диагнозом «сломалась склейка», а не «в base
            # симлинк». Проверяем здесь, где отказ может назвать себя.
            mode=$(git ls-tree "$BASE_SHA" -- "$f" 2>/dev/null | cut -d' ' -f1)
            case "$mode" in
              100644|100755) ;;
              "")
                echo "::error::$f нет в base ($BASE_SHA). Механика ревьюера читается из base"\
                     "по построению — иначе автор PR правит порог себе. PR, вводящий её,"\
                     "этим чеком не проверяется; смержите его."
                exit 1
                ;;
              *)
                echo "::error::$f в base — не обычный файл (режим $mode): механика"\
                     "ревьюера обязана быть исполнимым текстом, не ссылкой."
                exit 1
                ;;
            esac
            git show "$BASE_SHA:$f" > "$KIT/$(basename "$f")"
          done

      - name: Забрать диф — указатель на область ревью
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          WORK: ${{ runner.temp }}/review-work
        run: |
          set -euo pipefail
          # Все промежуточные файлы прогона — ВНЕ workspace. С переходом на
          # чекаут дерева PR корень workspace стал авторским пространством
          # имён: трекаемый симлинк `prompt.txt -> diff.patch` заставил бы
          # редирект ниже усечь только что скачанный диф ДО склейки — и модель
          # получила бы пустой патч, вернув «чисто» про непустой (найдено
          # гейтом на #98). `runner.temp` живёт снаружи GITHUB_WORKSPACE по
          # построению — авторский файл дотянуться туда не может.
          mkdir -p "$WORK"
          gh api "repos/$REPO/pulls/$PR" -H "Accept: application/vnd.github.v3.diff" \
            > "$WORK/diff.patch"
          bytes=$(wc -c < "$WORK/diff.patch")
          echo "diff bytes: $bytes"
          # Список изменённых путей PR — вход generated-фильтра на шаге
          # склейки. Имена из API сырые (без C-квотинга) — согласовано с
          # `core.quotePath=false` у check-attr ниже по workflow.
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[].filename' > "$WORK/changed-paths.txt"
          # Диф без изменений — не «ревью прошло», а нечего ревьюить: состояние
          # определённое и легитимно зелёное. Но зелёным оно должно стать ЯВНО, а
          # не пройдя к модели с пустым входом: иначе вердикт о пустоте выносит
          # модель, и «нечего смотреть» станет неотличимо от «посмотрел, чисто».
          if [ "$bytes" -gt 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            printf '{"findings":[],"note":"диф пуст — ревьюировать нечего"}' \
              > "$WORK/verdict.json"
          fi

      - name: Собрать промпт
        if: steps.diff.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KIT: ${{ runner.temp }}/trusted-kit
          WORK: ${{ runner.temp }}/review-work
        run: |
          set -euo pipefail

          # Вся механика — из $KIT (извлечена из base шагом выше): рабочее
          # дерево теперь авторское (head), и любой скрипт из него — рука
          # автора на собственном гейте. Диф и контекст склеиваются скриптами
          # кита через файлы: диф НИКОГДА не попадает ни в аргумент командной
          # строки, ни в подстановку выражений workflow — иначе его содержимое
          # интерпретировалось бы как часть команды.
          #
          # Зовём ЧЕРЕЗ `sh <файл>`: у кита глобальное ограничение POSIX `sh`,
          # а прямой вызов зависим от исполняемого бита (git show его не
          # переносит) и `noexec`-монтирования.

          # Курируемый контекст: контракты и инварианты из base. Три исхода
          # различаются намеренно: 0 — пакет собран; 3 — манифеста в base нет,
          # контекст не настроен, ревью без него; прочее — манифест ЕСТЬ, но
          # пакет не собран, и это отказ: молча съехать на «без контекста»
          # значило бы выдать вердикт без инвариантов за вердикт с ними.
          use_context=0
          set +e
          sh "$KIT/collect-context.sh" \
              --base "$BASE_SHA" \
              --manifest .github/codex/review-context.txt \
              > "$WORK/context.txt" 2> "$WORK/context.err"
          ctx_code=$?
          set -e
          case "$ctx_code" in
            0)
              use_context=1
              echo "контекст из base: $(grep -c '^--- ФАЙЛ ' "$WORK/context.txt") файл(ов)," \
                   "$(wc -c < "$WORK/context.txt") байт"
              grep '^--- ФАЙЛ ' "$WORK/context.txt" || true
              ;;
            3)
              cat "$WORK/context.err"
              echo "::notice::курируемый контекст не настроен — ревью без него."
              ;;
            *)
              cat "$WORK/context.err" >&2
              echo "::error::манифест контекста есть в base, но пакет не собран" \
                   "(код $ctx_code)."
              exit 1
              ;;
          esac

          # Argv собирается позиционными параметрами (форма local.sh): только
          # так флаги добавляются по частям без некавыченного раскрытия
          # строки, которое разваливается на пути с пробелом.
          set -- --prompt "$KIT/review-prompt.md" --diff "$WORK/diff.patch"
          if [ "$use_context" -eq 1 ]; then
            set -- "$@" --context "$WORK/context.txt"
          fi

          # ДЕПЛОЙ-ОГРАНИЧЕНИЕ: скрипты извлечены из base, а этот YAML — из
          # head, поэтому новый флаг кита передаётся только когда извлечённая
          # механика его уже знает — ДЕТЕКЦИЕЙ по литералу флага в скрипте,
          # не предположением (передача нового флага вслепую уже роняла
          # прогон кодом 2 — usage от базовой версии). До мержа кита фильтра
          # в CI нет: крупный generated-диф получает явный отказ по потолку —
          # честный и временный; после мержа ветка включается сама, без
          # второго PR.
          #
          # Generated — то, что репо ОБЪЯВИЛ в .gitattributes, причём
          # декларация читается ИЗ BASE (--source=$BASE_SHA), не из
          # merge-ref: workspace — дерево автора, и декларация из самого
          # патча прятала бы произвольный рукописный код — достаточно
          # объявить файл generated тем же коммитом (девятый заход гейта на
          # #99). Из base читается только влитое, то есть прошедшее ревью;
          # свежая декларация не действует в собственном PR — файл остаётся
          # в дифе (отказ в сторону ревью) и фильтруется со следующего PR.
          # local.sh симметрично читает из merge-base диапазона. `=true`
          # даёт значение "true", голый атрибут — "set"; парсинг с хвоста
          # строки: путь может содержать ": ".
          if grep -q -- '--generated-list' "$KIT/build-prompt.sh"; then
            git -c core.quotePath=false check-attr --stdin \
                --source="$BASE_SHA" linguist-generated \
                < "$WORK/changed-paths.txt" > "$WORK/generated-attrs.txt"
            sed -n -e 's/: linguist-generated: true$//p' \
                -e 's/: linguist-generated: set$//p' \
                "$WORK/generated-attrs.txt" > "$WORK/generated-paths.txt"
            set -- "$@" --generated-list "$WORK/generated-paths.txt"
          fi

          sh "$KIT/build-prompt.sh" "$@" > "$WORK/prompt.txt"

      - name: Ревью
        if: steps.diff.outputs.skip == 'false'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56  # v1.11
        with:
          openai-api-key: ${{ secrets.CODEX_REVIEW_API_KEY }}
          # Модель задаётся ЯВНО. Первый живой прогон упал на дефолте действия
          # (`gpt-5.6-sol`, к которому у проекта нет доступа) — и это не только
          # про доступ: дефолт действия может смениться в любой момент, а вместе
          # с ним поедет и гейт мержа. Та же неявная зависимость от окружения,
          # что версия Python в раннере или незаявленное право доступа.
          #
          # Почему не codex-вариант: ревьюеру здесь нужно не писать код, а
          # рассуждать о сценариях отказа и отличать «зелёное при неизвестном»
          # от настоящей проверки. Это рассуждение, а не кодогенерация.
          #
          # Снапшот, а не алиас `gpt-5.4`: алиас переезжает на новую версию
          # модели, и тот же диф начнёт давать другой вердикт, хотя в репозитории
          # ничего не менялось — тот самый дрейф, от которого этот пин и заводится,
          # просто уровнем глубже. Снапшоты со временем снимают с обслуживания:
          # тогда чек упадёт ГРОМКО и потребует осознанного бампа — в отличие от
          # алиаса, который меняет поведение молча.
          model: gpt-5.4-2026-03-05
          # Уровень рассуждения — тоже пин, и он не косметика. У GPT-5.4 дефолт
          # reasoning effort — `none` (поддерживаются none/low/medium/high/xhigh),
          # а пустой `effort` в действии означает «пусть Codex решит сам». То есть
          # ревьюер, от которого мы ждём разбора сценариев отказа, по умолчанию
          # работает без заявленного рассуждения — чек выглядит запиненным и при
          # этом способен дать ложный зелёный там, где дефект виден только на
          # нескольких шагах вывода. Найдено самим ревьюером на прошлом PR.
          effort: high
          # Версия CLI тоже пинится: дефолт пустой = «последняя», то есть поведение
          # гейта менялось бы вместе с чужим релизом. Тот же класс, что алиас модели.
          codex-version: "0.148.0"
          # Промпт и вердикт — вне workspace: авторский симлинк на этих путях
          # иначе перенаправил бы запись (см. шаг дифа).
          prompt-file: ${{ runner.temp }}/review-work/prompt.txt
          output-file: ${{ runner.temp }}/review-work/verdict.json
          # Схема — из доверенного каталога, не из дерева: дерево авторское.
          output-schema-file: ${{ runner.temp }}/trusted-kit/review-schema.json
          permission-profile: ":read-only"

      - name: Сохранить вердикт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/review-work/verdict.json
          if-no-files-found: error

  # Джоб 2 имеет право писать, но НЕ видит ни ключа, ни дифа — только вердикт.
  # Он же и есть красный/зелёный чек по порогу серьёзности.
  report:
    needs: review
    # Без этого условия `needs:` уводит джоб в `skipped`, когда `review` падает —
    # а GitHub засчитывает пропущенный required-чек как УДОВЛЕТВОРЁННЫЙ. То есть
    # ровно в момент, когда этот чек станет обязательным, недоступность Codex
    # читалась бы как «ревью пройдено». Найдено не тестом, а случайным отказом в
    # бою: 2026-08-21 на PR #86 кончились кредиты OpenAI, `review` упал за 30
    # секунд, и rollup показал `review=failure` при `report=skipped`.
    #
    # Инвариант один: КРАСНОЕ ВЕЗДЕ, где нет годного вердикта. Поэтому
    # `always()`, а не перечисление состояний.
    #
    # Две предыдущие редакции этого условия пытались вычесть из `always()`
    # состояния, которые «не отказ»: сначала `cancelled`, потом `cancelled` и
    # `skipped`. Обе вычитали дыру того же класса, который тут и чинится —
    # вычтенное состояние даёт `skipped`-джоб, а GitHub засчитывает пропущенный
    # required-чек как удовлетворённый. Отмена джоба на текущем head-SHA
    # (человек нажал Cancel, вытеснили раннер, отменил сам GitHub) оставляла бы
    # PR мержабельным вообще без вердикта. Найдено гейтом на этом же PR.
    #
    # Законно-зелёное состояние выражается СИНТЕТИЧЕСКИМ вердиктом — так уже
    # сделано выше для пустого дифа — а не пропуском джоба. Кто захочет дать
    # `review` условие пропуска, обязан пойти тем же путём.
    #
    # Цена принята сознательно и состоит из двух частей.
    #
    # 1. Вытесненный прогон (`cancel-in-progress`) тоже покраснеет. Его чеки
    #    висят на устаревшем SHA и на мерж не влияют — косметика.
    # 2. `always()` переживает отмену, поэтому вытесненный прогон доработает
    #    `report` и додержит слот concurrency: свежий прогон подождёт. Задержка
    #    ограничена — на отменённом пути джоб делает попытку скачивания, `jq` и
    #    выход, без единого сетевого вызова `gh` (комментарий там не
    #    публикуется). Секунды, не минуты.
    #
    # Не чинить это вычитанием `cancelled` из условия — уже пробовали дважды,
    # и оба раза вычитание открывало дыру: отменённый на ТЕКУЩЕМ head-SHA
    # прогон (человек нажал Cancel, вытеснили раннер) давал `skipped`, который
    # засчитывается required-чеку как пройденный. Обмен «секунды задержки на
    # вытесненных прогонах» против «мержабельный PR без вердикта» — не обмен.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Скрипт порога читается из base, как промпт/схема/склейка в джобе review
      # (спека §4): иначе автор PR правит apply-threshold.sh на `exit 0` и
      # снимает гейт себе же. Чекаут здесь безопасен ТОЛЬКО потому, что страж
      # ниже судит по DOWNLOAD_OUTCOME, а не по наличию файла с нужным именем
      # (steward#87) — а сами два источника (доверенный чекаут base и
      # недоверенный артефакт из review) разведены ниже НЕ подкаталогом
      # внутри чекаута, а каталогом ВНЕ его (`runner.temp`) — пересечение
      # путей невозможно по построению, а не потому что сегодня под
      # подкаталогом ничего не трекается (находка гейта на #92: подкаталог
      # внутри чекаута этого не закрывал до конца — трекаемый файл в base на
      # том же относительном пути всё ещё мог бы совпасть).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Очистить каталог артефакта перед скачиванием
        # Раннер может быть self-hosted и переиспользоваться между прогонами
        # — `${{ runner.temp }}` тогда НЕ гарантированно пуст в начале джоба.
        # Без этой очистки: `verdict.json`, оставшийся с прошлого прогона на
        # этом же пути, плюс скачивание, которое вернуло `success`, но не
        # принесло ожидаемого файла (или вовсе не принесло артефакт), дают
        # `DOWNLOAD_OUTCOME == success` и `-f "$VERDICT_FILE"` — истину, но на
        # ЧУЖОМ, устаревшем файле. Страж «вердикта нет» пропустил бы это как
        # годный вердикт ТЕКУЩЕГО прогона. Тот же класс, что коллизия
        # чекаута с артефактом выше, только по ВРЕМЕНИ, а не по месту —
        # закрывается симметрично: гарантируем пустое состояние ДО
        # скачивания, а не полагаемся, что раннер и так его даёт.
        run: rm -rf "${{ runner.temp }}/codex-verdict"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        # Артефакта нет, если `review` не дожил до выгрузки. Ронять джоб прямо
        # здесь нельзя: нужен наш собственный отказ с внятной причиной, иначе
        # красный чек неотличим от вердикта с находками.
        id: download
        continue-on-error: true
        with:
          name: codex-verdict
          # ВНЕ чекаута — не подкаталог внутри него. Первая редакция клала
          # артефакт в `artifact/` под корнем чекаута: сегодня столкновения
          # нет (артефакт содержит только verdict.json, в base ничего под
          # `artifact/` не трекается), но это по-прежнему свойство
          # СОДЕРЖИМОГО, а не структуры — трекаемый `artifact/verdict.json`
          # в base (фикстура, пример) совпал бы путём, и порог применился бы
          # к содержимому дерева вместо вердикта прогона. Тот же урок, что
          # уже дважды учили в этой арке на страже DOWNLOAD_OUTCOME:
          # «сегодня не пересекается» — свойство окружения, не наше право.
          # `runner.temp` живёт СНАРУЖИ GITHUB_WORKSPACE (чекаут кладёт файлы
          # только внутрь него) — каталоги разные по построению, и никакой
          # будущий файл в репозитории на это уже не повлияет.
          path: ${{ runner.temp }}/codex-verdict

      - name: Опубликовать сводку и применить порог
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Через env, а не подстановкой в тело скрипта: значение подставляет
          # форджа, и в `run:` оно стало бы конкатенацией, а не данными.
          REVIEW_RESULT: ${{ needs.review.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # ${{ runner.temp }} — контекст форджи, не текст из PR/issue; тот же
          # класс подстановки через env, что и остальные значения выше.
          VERDICT_FILE: ${{ runner.temp }}/codex-verdict/verdict.json
          # Туда же, где вердикт — не в чекаут base. Read-only workspace
          # (смонтирован без прав на запись) — реальный сценарий на
          # self-hosted раннере/container job, а body.md нам всегда только
          # ПИСАТЬ, читать чужого содержимого оттуда не требуется — незачем
          # держать его там, где мы обязаны уметь писать, но можем не мочь.
          BODY_FILE: ${{ runner.temp }}/codex-verdict/body.md
        run: |
          set -euo pipefail

          # Каталог гарантированно существует к моменту любой попытки
          # написать `$BODY_FILE` ниже — и в ветке "вердикта нет" (пишется,
          # даже если download-artifact так и не создал каталог, например
          # артефакта не было вовсе), и в ветке применения порога. `mkdir -p`
          # безопасен и когда каталог уже создан download-artifact выше.
          mkdir -p "$(dirname "$BODY_FILE")"

          # Отсутствующий вердикт — ОТДЕЛЬНОЕ состояние: инструмент не отработал.
          # Оно обязано быть красным (иначе сбой Codex читается как пройденное
          # ревью), но обязано и НАЗЫВАТЬ себя: красный чек без объяснения
          # неотличим от вердикта с находками, и человек полезет искать дефект
          # в своём патче там, где кончились кредиты.
          # Судим по ИСХОДУ СКАЧИВАНИЯ, а не по наличию файла с нужным именем.
          # Проверка `-f "$VERDICT_FILE"` спрашивает «лежит ли что-то по этому
          # пути», хотя вопрос стоит «выдал ли ЭТОТ прогон вердикт». Путь —
          # `${{ runner.temp }}/…`, ВНЕ чекаута (см. `path:` у download-artifact
          # выше): пересечение с деревом base исключено по построению, не по
          # тому, что там сегодня ничего не лежит. Разницы самой проверке это
          # не даёт — она всё равно СИМПТОМ, не причина, и служит только доп.
          # стражем на случай второго, независимого отказа (скачивание
          # вернуло success, но файла почему-то нет). Найдено гейтом на #90,
          # закрыто путём — гейтом на #92.
          if [ "$REVIEW_RESULT" != success ] \
            || [ "$DOWNLOAD_OUTCOME" != success ] || [ ! -f "$VERDICT_FILE" ]; then
            # Вердикта нет по одной из двух РАЗНЫХ причин, и разбор они уводят
            # в разные джобы. Валить их в одно сообщение — значит отправить
            # человека читать логи `review` там, где сломалось хранилище
            # артефактов. Красное в обоих случаях одинаково верно; неверным
            # было бы объяснение.
            if [ "$REVIEW_RESULT" != success ]; then
              # Намеренно НЕ утверждаем, где именно сломался `review`: он мог не
              # дойти до Codex, а мог упасть после выгрузки вердикта. Второе —
              # причина, по которой сам факт наличия артефакта не делает прогон
              # годным: вердикт есть, а джоб, который за него отвечает, красный.
              why="джоб review завершился неуспешно (review: $REVIEW_RESULT); вердикту этого прогона нельзя доверять, даже если артефакт скачался"
              where="логи джоба review — кредиты API, простой, таймаут, сбой выгрузки"
            elif [ "$DOWNLOAD_OUTCOME" != success ]; then
              why="джоб review успешен, но артефакт не скачался (скачивание: $DOWNLOAD_OUTCOME)"
              where="шаг скачивания в ЭТОМ джобе — хранилище артефактов или API форджи, не дефект патча"
            else
              why="артефакт скачан, но файла verdict.json в нём нет"
              where="шаг выгрузки в джобе review"
            fi

            # Сначала аннотация, потом комментарий. Обратный порядок стоил бы
            # ровно того объяснения, ради которого ветка и заведена: `gh pr
            # comment` может отказать (форк-PR, урезанный GITHUB_TOKEN), и под
            # `set -e` шаг умер бы ДО `::error::` — красный джоб без причины.
            echo "::error::вердикта нет — чек Codex не отработал; красный. $why"

            # Комментарий — когда есть что сказать по существу И прогон ещё
            # актуален. Одного `REVIEW_RESULT` для второго условия НЕ хватает:
            # `review` мог упасть ДО вытеснения прогона, тогда результат равен
            # `failure`, хотя SHA уже устарел, — и PR зарастал бы сообщениями от
            # обгоняющих друг друга пушей ровно так, как обещано не делать.
            # Найдено гейтом на этом же PR: заявленное свойство кодом не
            # обеспечивалось. Сверяемся с настоящим head PR.
            #
            # Не смогли спросить — комментируем: молчание хуже дубля.
            current=$(gh pr view "$PR" --repo "$REPO" --json headRefOid \
              --jq .headRefOid 2>/dev/null || true)
            if [ -n "$current" ] && [ "$current" != "$HEAD_SHA" ]; then
              echo "::warning::прогон устарел (был $HEAD_SHA, сейчас $current) — комментарий не публикуется"
              exit 1
            fi

            if [ "$REVIEW_RESULT" = failure ] || [ "$REVIEW_RESULT" = success ]; then
              {
                echo "## Ревью Codex — чек НЕ отработал"
                echo
                echo "Судить о патче не по чему: $why."
                echo
                echo "Это отказ инструмента, а не находка в коде. Смотреть: $where."
                echo
                echo "_Красным это сделано намеренно. Пропущенный чек GitHub засчитал"
                echo "бы обязательному как пройденный — неизвестность выглядела бы"
                echo "зелёной._"
              } > "$BODY_FILE"
              # Отказ комментирования не должен подменять причину отказа чека.
              gh pr comment "$PR" --repo "$REPO" --body-file "$BODY_FILE" \
                || echo "::warning::комментарий не опубликован; чек всё равно красный"
            fi
            exit 1
          fi

          # Невалидный вердикт — отказ, а не «замечаний нет». `apply-threshold.sh`
          # сам это проверяет (severity вне enum, элемент-не-объект, нестроковый
          # note — см. его комментарии) и возвращает код 2, отличимый от кода 1
          # (находки выше порога) — это и даёт нам различить два красных ниже.
          #
          # `set -e` снят вокруг вызова НАМЕРЕННО: нужен И отрендеренный вывод
          # ($BODY_FILE для комментария), И код выхода. Находки выше порога —
          # код 1, ожидаемый исход, не ошибка шага; под голым `set -e` он
          # уронил бы шаг ДО публикации комментария, и красный чек остался бы
          # без объяснения.
          #
          # Зовём ЧЕРЕЗ `sh <файл>` (см. развёрнутый разбор у build-prompt.sh в
          # джобе review — та же причина, тот же класс скрипта): шебанг ничего
          # не решает при глобальном ограничении кита на POSIX `sh`, а прямой
          # вызов зависим от исполняемого бита и `noexec`-монтирования, чего
          # `sh <файл>` не требует.
          #
          # --verdict — из $VERDICT_FILE, каталога ВНЕ чекаута (`path:` у
          # download-artifact выше, ${{ runner.temp }}), а не из подкаталога
          # внутри него: сам исполняемый скрипт при этом читается из
          # доверенного base (текущий рабочий каталог после чекаута),
          # артефакт — только его аргумент, живущий структурно в другом
          # месте. Столкновение путей исключено по построению, не по
          # содержимому.
          #
          # `> "$BODY_FILE"` НИЖЕ открывает целевой файл SHELL'ОМ, ДО того как
          # apply-threshold.sh вообще запустится: read-only workspace,
          # кончившийся диск, не те права — и shell завершает команду кодом 1
          # (обычно), сам скрипт не запускался вовсе. `1` в разборе ниже
          # означает «находки выше порога» — отказ ИНФРАСТРУКТУРЫ снова
          # предъявился бы как вердикт о патче, тот же класс, что этот PR и
          # разделяет, просто слоем глубже (не код скрипта, а сам факт его
          # запуска). Создаём файл ЗАРАНЕЕ, отдельной командой — её неудача
          # трактуется как отказ инструмента САМА ПО СЕБЕ, без публикации
          # (публиковать нечего и незачем: пустой комментарий хуже
          # молчания). `rc` от вызова apply-threshold.sh ниже относится уже
          # ТОЛЬКО к самому скрипту.
          if ! : > "$BODY_FILE"; then
            echo "::error::не удалось создать $BODY_FILE — отказ инструмента" \
                 "(окружение: read-only workspace, диск, права), не вердикт" \
                 "о патче; чек красный"
            exit 1
          fi

          set +e
          sh scripts/review/apply-threshold.sh \
              --verdict "$VERDICT_FILE" --format markdown > "$BODY_FILE"
          rc=$?
          set -e

          # Контракт apply-threshold.sh закрытый — 0 (чисто), 1 (находки выше
          # порога), 2 (вердикт негоден) — и ТОЛЬКО эти три кода означают, что
          # скрипт реально доработал до содержательного исхода. Раньше здесь
          # проверялся только `rc -eq 2`, а ЛЮБОЙ другой ненулевой код (сбой
          # `jq`, неопознанный флаг, оборванный редирект, 127 у неисполнимого
          # файла) молча утекал в ветку «находки выше порога» — инфраструктурная
          # поломка ВЫЗЫВАЮЩЕГО маскировалась под находки ревьюера. Тот же
          # класс, что мы весь день чинили ВНУТРИ кита (raw exit code как
          # вердикт о патче), воспроизведённый здесь, на вызове кита. `case`
          # перечисляет ИЗВЕСТНЫЕ коды явно; всё остальное — отдельная ветка
          # отказа инструмента, а не молчаливое падение в «находки».
          case "$rc" in
            0|1)
              # Сводным комментарием, а не review-threads: threads блокируют
              # брокер до разрешения человеком, и `nit` останавливал бы мерж
              # наравне с дефектом. Отказ комментирования не должен подменять
              # причину отказа чека.
              gh pr comment "$PR" --repo "$REPO" --body-file "$BODY_FILE" \
                || echo "::warning::комментарий не опубликован; чек всё равно красный"
              if [ "$rc" -ne 0 ]; then
                echo "::error::находки уровня blocker/major — чек красный"
                exit 1
              fi
              echo "находок выше порога нет"
              ;;
            2)
              # Рендера нет — публиковать нечего ($BODY_FILE пуст: скрипт
              # падает ДО первой строки вывода). Причина уже в stderr скрипта,
              # которое осталось в логе этого шага.
              echo "::error::вердикт негоден — чек красный"
              exit 1
              ;;
            *)
              # Код вне {0,1,2} — apply-threshold.sh НЕ дошёл до содержательного
              # исхода: содержимое $BODY_FILE на этот момент не определено
              # (могло оборваться в середине рендера), публиковать его как
              # находки нельзя. Отдельная аннотация, называющая ИМЕННО отказ
              # инструмента — не «находки», которых по факту не было.
              echo "::error::apply-threshold.sh завершился неожиданным кодом" \
                   "$rc — отказ инструмента, не вердикт о патче; чек красный"
              exit 1
              ;;
          esac
