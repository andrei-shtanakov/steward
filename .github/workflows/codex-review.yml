# codex-review — независимое ревью дифа другой моделью (ADR-ECO-004 I3).
#
# Зачем не «ещё один линтер»: код в этом репо пишет преимущественно Claude, а I3
# говорит прямо — «a same-model/same-prompt reviewer buys ~zero independence».
# Ценность здесь ровно в том, что модель другого вендора, а рамка — опровержение.
#
# Чек, НЕ аппрув. По I3 adversarial verifier может быть «one more required-check,
# never the sole authority». Аппрув агентом — отдельный, ещё не принятый разговор.
#
# Кого блокирует: брокер требует зелёным ВЕСЬ rollup, поэтому красный чек
# останавливает агентский мерж. Человеческий путь не затронут — в ruleset этот
# чек намеренно не вносится, пока не посмотрим на качество вердиктов.
#
# Порог: красным делают только `blocker` и `major`. `minor`/`nit` уезжают в
# сводный комментарий и никого не держат — иначе контур станет ручным на каждом
# придиразме.
name: codex-review

on:
  pull_request:

permissions: {}

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Джоб 1 читает недоверенный текст (диф) и держит ключ. Поэтому у него НЕТ
  # прав на запись и НЕТ checkout'а кода PR: инъекция через содержимое PR
  # обезврежена отсутствием того, чем можно воспользоваться, а не бдительностью.
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Чтение PR (`GET /repos/{}/pulls/{}`) требует именно этого права. Сегодня
      # шаг проходит и без него, потому что репозиторий публичный, — но это
      # послабление форджа, а не наше право: закроют репо, и диф отвалится молча.
      pull-requests: read
    steps:
      # Checkout BASE, а не PR: промпт и схема — вход ревьюера, и версия из PR
      # позволила бы автору патча переписать инструкции своему же ревьюеру.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Забрать только диф (без checkout кода PR)
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" -H "Accept: application/vnd.github.v3.diff" > diff.patch
          bytes=$(wc -c < diff.patch)
          echo "diff bytes: $bytes"
          # Диф без изменений — не «ревью прошло», а нечего ревьюить: состояние
          # определённое и легитимно зелёное. Но зелёным оно должно стать ЯВНО, а
          # не пройдя к модели с пустым входом: иначе вердикт о пустоте выносит
          # модель, и «нечего смотреть» станет неотличимо от «посмотрел, чисто».
          if [ "$bytes" -gt 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            printf '{"findings":[],"note":"диф пуст — ревьюировать нечего"}' > verdict.json
          fi

      - name: Собрать промпт
        if: steps.diff.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Инструкции ревьюера берутся из base намеренно (см. checkout выше), и у
          # этого есть прямое следствие: PR, который их ВВОДИТ или МЕНЯЕТ, сам собой
          # не проверяется — в base их ещё нет или они другие. Это не обходится, это
          # цена того, что автор патча не может переписать промпт своему ревьюеру.
          # Отказ должен объяснять себя, иначе читается как поломка инфраструктуры.
          for f in .github/codex/review-prompt.md .github/codex/review-schema.json; do
            [ -f "$f" ] && continue
            echo "::error::$f нет в base ($BASE_SHA). Инструкции ревьюера читаются из"\
                 "base по построению, поэтому PR, вводящий их, этим чеком не"\
                 "проверяется. Смержите его — на следующих PR чек заработает."
            exit 1
          done
          # Промпт и диф склеиваются в файл: диф НИКОГДА не попадает ни в
          # аргумент командной строки, ни в подстановку выражений workflow —
          # иначе его содержимое интерпретировалось бы как часть команды.
          {
            cat .github/codex/review-prompt.md
            printf '\n\n--- ДИФ НАЧАЛО ---\n'
            cat diff.patch
            printf '\n--- ДИФ КОНЕЦ ---\n'
          } > prompt.txt

      - name: Ревью
        if: steps.diff.outputs.skip == 'false'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56  # v1.11
        with:
          openai-api-key: ${{ secrets.CODEX_REVIEW_API_KEY }}
          # Модель задаётся ЯВНО. Первый живой прогон упал на дефолте действия
          # (`gpt-5.6-sol`, к которому у проекта нет доступа) — и это не только
          # про доступ: дефолт действия может смениться в любой момент, а вместе
          # с ним поедет и гейт мержа. Та же неявная зависимость от окружения,
          # что версия Python в раннере или незаявленное право доступа.
          #
          # Почему не codex-вариант: ревьюеру здесь нужно не писать код, а
          # рассуждать о сценариях отказа и отличать «зелёное при неизвестном»
          # от настоящей проверки. Это рассуждение, а не кодогенерация.
          #
          # Снапшот, а не алиас `gpt-5.4`: алиас переезжает на новую версию
          # модели, и тот же диф начнёт давать другой вердикт, хотя в репозитории
          # ничего не менялось — тот самый дрейф, от которого этот пин и заводится,
          # просто уровнем глубже. Снапшоты со временем снимают с обслуживания:
          # тогда чек упадёт ГРОМКО и потребует осознанного бампа — в отличие от
          # алиаса, который меняет поведение молча.
          model: gpt-5.4-2026-03-05
          # Уровень рассуждения — тоже пин, и он не косметика. У GPT-5.4 дефолт
          # reasoning effort — `none` (поддерживаются none/low/medium/high/xhigh),
          # а пустой `effort` в действии означает «пусть Codex решит сам». То есть
          # ревьюер, от которого мы ждём разбора сценариев отказа, по умолчанию
          # работает без заявленного рассуждения — чек выглядит запиненным и при
          # этом способен дать ложный зелёный там, где дефект виден только на
          # нескольких шагах вывода. Найдено самим ревьюером на прошлом PR.
          effort: high
          # Версия CLI тоже пинится: дефолт пустой = «последняя», то есть поведение
          # гейта менялось бы вместе с чужим релизом. Тот же класс, что алиас модели.
          codex-version: "0.148.0"
          prompt-file: prompt.txt
          output-file: verdict.json
          output-schema-file: .github/codex/review-schema.json
          permission-profile: ":read-only"

      - name: Сохранить вердикт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codex-verdict
          path: verdict.json
          if-no-files-found: error

  # Джоб 2 имеет право писать, но НЕ видит ни ключа, ни дифа — только вердикт.
  # Он же и есть красный/зелёный чек по порогу серьёзности.
  report:
    needs: review
    # Без этого условия `needs:` уводит джоб в `skipped`, когда `review` падает —
    # а GitHub засчитывает пропущенный required-чек как УДОВЛЕТВОРЁННЫЙ. То есть
    # ровно в момент, когда этот чек станет обязательным, недоступность Codex
    # читалась бы как «ревью пройдено». Найдено не тестом, а случайным отказом в
    # бою: 2026-08-21 на PR #86 кончились кредиты OpenAI, `review` упал за 30
    # секунд, и rollup показал `review=failure` при `report=skipped`.
    #
    # Инвариант один: КРАСНОЕ ВЕЗДЕ, где нет годного вердикта. Поэтому
    # `always()`, а не перечисление состояний.
    #
    # Две предыдущие редакции этого условия пытались вычесть из `always()`
    # состояния, которые «не отказ»: сначала `cancelled`, потом `cancelled` и
    # `skipped`. Обе вычитали дыру того же класса, который тут и чинится —
    # вычтенное состояние даёт `skipped`-джоб, а GitHub засчитывает пропущенный
    # required-чек как удовлетворённый. Отмена джоба на текущем head-SHA
    # (человек нажал Cancel, вытеснили раннер, отменил сам GitHub) оставляла бы
    # PR мержабельным вообще без вердикта. Найдено гейтом на этом же PR.
    #
    # Законно-зелёное состояние выражается СИНТЕТИЧЕСКИМ вердиктом — так уже
    # сделано выше для пустого дифа — а не пропуском джоба. Кто захочет дать
    # `review` условие пропуска, обязан пойти тем же путём.
    #
    # Цена: вытесненный прогон (`cancel-in-progress`) тоже покраснеет. Его чеки
    # висят на устаревшем SHA и на мерж не влияют — это косметика против
    # настоящей дыры.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        # Артефакта нет, если `review` не дожил до выгрузки. Ронять джоб прямо
        # здесь нельзя: нужен наш собственный отказ с внятной причиной, иначе
        # красный чек неотличим от вердикта с находками.
        continue-on-error: true
        with:
          name: codex-verdict

      - name: Опубликовать сводку и применить порог
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Через env, а не подстановкой в тело скрипта: значение подставляет
          # форджа, и в `run:` оно стало бы конкатенацией, а не данными.
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          set -euo pipefail

          # Отсутствующий вердикт — ОТДЕЛЬНОЕ состояние: инструмент не отработал.
          # Оно обязано быть красным (иначе сбой Codex читается как пройденное
          # ревью), но обязано и НАЗЫВАТЬ себя: красный чек без объяснения
          # неотличим от вердикта с находками, и человек полезет искать дефект
          # в своём патче там, где кончились кредиты.
          if [ ! -f verdict.json ]; then
            # Сначала аннотация, потом комментарий. Обратный порядок стоил бы
            # ровно того объяснения, ради которого ветка и заведена: `gh pr
            # comment` может отказать (форк-PR, урезанный GITHUB_TOKEN), и под
            # `set -e` шаг умер бы ДО `::error::` — красный джоб без причины.
            echo "::error::вердикт не выгружен ($REVIEW_RESULT) — чек Codex не отработал; красный"

            # Комментарий — только когда инструмент реально сломался. Отменённый
            # прогон комментировать нечем и незачем: `cancel-in-progress`
            # вытесняет прогон на каждом пуше, и PR зарастал бы «чек не
            # отработал» на каждый промежуточный коммит.
            if [ "$REVIEW_RESULT" = failure ]; then
              {
                echo "## Ревью Codex — чек НЕ отработал"
                echo
                echo "Джоб \`review\` не дошёл до выгрузки вердикта, поэтому судить"
                echo "о патче не по чему. Это отказ инструмента, а не находка в коде:"
                echo "смотреть логи джоба \`review\` (кредиты API, простой, таймаут)."
                echo
                echo "_Красным это сделано намеренно. Пропущенный чек GitHub засчитал"
                echo "бы обязательному как пройденный — неизвестность выглядела бы"
                echo "зелёной._"
              } > body.md
              # Отказ комментирования не должен подменять причину отказа чека.
              gh pr comment "$PR" --repo "$REPO" --body-file body.md \
                || echo "::warning::комментарий не опубликован; чек всё равно красный"
            fi
            exit 1
          fi

          # Невалидный вердикт — отказ, а не «замечаний нет».
          jq -e '.findings | type == "array"' verdict.json > /dev/null \
            || { echo "::error::вердикт нечитаем — считаем чек красным"; exit 1; }

          blocking=$(jq '[.findings[] | select(.severity == "blocker" or .severity == "major")] | length' verdict.json)
          total=$(jq '.findings | length' verdict.json)

          {
            echo "## Ревью Codex — независимый чек"
            echo
            jq -r '.note // ""' verdict.json
            echo
            if [ "$total" = 0 ]; then
              echo "Находок нет."
            else
              echo "| уровень | файл | находка | сценарий отказа |"
              echo "|---|---|---|---|"
              # Текст вердикта пишет модель: перевод строки или `|` внутри поля
              # разорвал бы таблицу молча. Схлопываем и экранируем.
              jq -r '
                def cell: (. // "") | gsub("\\r?\\n"; " ") | gsub("\\|"; "\\|");
                .findings[] | "| \(.severity|cell) | `\(.file|cell)` | \(.summary|cell) | \(.failure|cell) |"
              ' verdict.json
            fi
            echo
            echo "_Порог: красным делают \`blocker\` и \`major\`. Это чек, не аппрув —"
            echo "и не замена ревью человека._"
          } > body.md

          # Сводным комментарием, а не review-threads: threads блокируют брокер до
          # разрешения человеком, и `nit` останавливал бы мерж наравне с дефектом.
          gh pr comment "$PR" --repo "$REPO" --body-file body.md

          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking находк(и) уровня blocker/major — чек красный"
            exit 1
          fi
          echo "находок всего: $total, блокирующих: 0"
