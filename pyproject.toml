[project]
name = "steward"
version = "0.1.0"
description = "Spec governance layer: gated multi-artifact authoring above spec-runner/Maestro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pyrefly",
    "jsonschema>=4.26.0",
]

[project.scripts]
gate-check = "steward.gatecheck.cli:app"
steward = "steward.riskclassify.cli:app"
steward-compile = "steward.compile.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.prograph]
# intended-graph манифест системы WS-005 (schema intended-graph/v1, prograph#22)
intended = "workstreams/WS-005-gate-verdicts/spec/intended-graph.yaml"
