    и alias-путями `match: {files: [docs/CHANGELOG.md, CHANGELOG.md]}` (alias-пути
    — заявленная фича спеки, §5 «alias-пути допустимы»; multi-file `match.files` используется
    в tests/review_eval/test_matcher.py:571). На `head_sha` файла `docs/CHANGELOG.md`
    нет (gold верен), а `CHANGELOG.md` в корне есть. Вариант выдаёт находку `kind:
    file-missing, file: CHANGELOG.md` с ключевым словом gold. Матчер строит ребро
    (kind совпал, нормализованный путь входит в `match.files`) и назначает находку
    этому gold. `_refuted_file_missing` проверяет `file_lines(''CHANGELOG.md'')` →
    не `None` → находка опровергнута (верно: её утверждение ложно). Затем `_contradicted_gold`:
    первый путь проверяет `file_lines(''docs/CHANGELOG.md'')` → `None` → gold не противоречит;
    но второй путь (`ids.update(matched.assigned[pos] for pos in refuted ...)`) добавляет
    id этого gold в `contradicted_gold`.'
