- id: D-andrei-shtanakov.steward-167-2
  severity: minor
  file: src/steward/review_eval/runner.py
  line_hint: 910
  scenario: 'Полный `--rerun` надмножеством кейсов с другим `repetitions` отказывает с ПУСТЫМ
    списком «не запрошены: —». Манифест: кейсы [A, B], `repetitions: 1`; запрос `run_all([A, B,
    C], repetitions=2, rerun=True)` — полный сброс с надмножеством плюс рост повторений, оба пути
    поддержаны по отдельности. Условие отказа сформулировано как неравенство МНОЖЕСТВ (`set(case_ids)
    != set(manifest_cases)`), а не как «есть кейсы манифеста вне запроса», поэтому для надмножества
    оно истинно, хотя `missing = manifest − case_ids` пусто, и сообщение печатает `''—''`.'
