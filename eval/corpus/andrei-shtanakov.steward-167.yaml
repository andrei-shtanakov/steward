notes: |-
  Кейс добора 2026-09-18 из раунда ревью, НЕ последнего: у PR 167 три раунда, major
  найден вторым (ревью id=5215751738, голова 5ed67ec2), а третий раунд major уже не
  содержит. `corpus candidates` берёт только последний раунд, поэтому кейс заведён
  руками из тела того ревью (см. review-eval-candidates-review-round).

  Зачем именно этот PR: все три находки раунда лежат в `src/steward/review_eval/runner.py`,
  то есть в исполняемом Python, а не в прозе. До добора корпус был почти целиком про
  рассогласования текста с кодом (находка ревью-контура на PR #170, minor/high).

  Все ТРИ находки ПОДТВЕРЖДЕНЫ, и каждая принята автором — в master стоит ровно то
  исправление, которого требовала находка:
  - D-…-167-1 (major): на голове ревью `_require_run_path` возвращает `.resolve()`, а
    `out_dir` собирается как `Path(os.path.abspath(out_dir))` БЕЗ `.resolve()` — отсюда
    лексическое несовпадение `is_relative_to`. В master обе строки `out_dir` имеют
    `.resolve()` (`Path(os.path.abspath(out_dir)).resolve()`), то есть расхождение
    устранено именно добавлением резолва.
  - D-…-167-2 (minor): в master условие отказа получило guard `and missing`, а
    комментарий рядом прямо говорит «Отказ только когда кейсы манифеста не запрошены:
    надмножество с полным сбросом — законный путь» — ровно то, что требовала находка.
  - D-…-167-3 (minor): в master захват идёт с `errors="replace"`, и комментарий
    дословно повторяет находку: «байт вне UTF-8 в выводе кита не роняет оплаченный
    прогон». Заявленная ревьюером `confidence: low` не мешает: факт проверен по дереву.

  blocking_complete: FALSE СОЗНАТЕЛЬНО. Диапазон — 6 файлов и 6085 добавленных строк, из
  них ~2350 строк нового исполняемого кода (`runner.py` создаётся этим PR целиком,
  плюс `cache.py`, `threshold.py`); сплошь я его НЕ читал. По контракту D8 кейс входит в
  precision и НЕ входит в знаменатели `blocking_recall`/`false_block_rate`. Поднять флаг
  — отдельная работа по сплошному чтению, заведена пунктом
  review-eval-167-blocking-complete: до неё блокирующий gold в Python в знаменатель
  recall не входит, и в знаменателе остаются major из #137 (исполняемая конфигурация CI)
  и два markdown-major из #130/#162.
  МАТЕРИАЛИЗУЕМОСТЬ ГОЛОВЫ ПРОВЕРЕНА 2026-09-18, повторно и точно. Голова этого
  кейса — второй из трёх раундов, то есть голова ДО фикса; открытый пункт
  `review-eval-prefix-heads` предупреждает, что такие достижимы только через
  `refs/pull/<n>/head` и материализация такого объекта — отдельный шаг.
  Первая запись этой проверки утверждала, что она сделана «ровно тем путём,
  которым идёт cache.py», а фактическая команда несла `--depth 1` и шла в пустой
  репозиторий — два расхождения с кодом сразу (находка приёмочного dry-run на
  PR #170, minor/high). Проверка повторена ИМЕННО кодовым путём: при пинах
  `GIT_CONFIG_GLOBAL/SYSTEM=/dev/null`, `LC_ALL=C` выполнено
  `git clone --bare --no-hardlinks https://github.com/andrei-shtanakov/steward.git`,
  затем `git fetch <remote_url> <sha>` БЕЗ `--depth`, затем
  `git cat-file -e <sha>^{commit}` — ровно последовательность `ensure_objects`.
  Результат для `5ed67ec2`: после клона объекта НЕТ (как и предполагает
  `cache.py`), сетевой `fetch` по SHA проходит, и `has_object` после него
  подтверждает объект. Худший сценарий находки — отказ `corpus materialize` на
  чистой машине — не наступает.
