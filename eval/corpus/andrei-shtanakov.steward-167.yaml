- id: D-andrei-shtanakov.steward-167-1
  severity: major
  file: src/steward/review_eval/runner.py
  line_hint: 946
  scenario: '`--rerun` под симлинк-префиксом `--out` ложно отказывает: остаток считается лексически
    между resolved-целями и нерезолвленными результатами. `--out /tmp/eval-run` на macOS (`/tmp`
    → `/private/tmp`), первый прогон завершён; затем правится кит и идёт полный `run_all(...,
    rerun=True)` по всему набору — ровно тот выход, который называет сообщение о дрейфе. `_reset_targets`
    отдаёт цели через `_require_run_path` → `.resolve()` (`/private/tmp/...`), а `_remaining_results`
    обходит НЕрезолвленный `out_dir` (`Path(os.path.abspath(out_dir))`, без `.resolve()`) и отдаёт
    `/tmp/...`. `Path.is_relative_to` чисто лексический, поэтому ни один результат не «внутри»
    ни одной цели, `leftover` — весь каталог, и раннер отказывает «начните прогон в другом --out»,
    хотя выборка полная и результатов вне выборки нет. Оба документированных пути восстановления
    недоступны.'
