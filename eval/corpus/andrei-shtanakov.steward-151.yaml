  Первая версия этой записи дефект СОЗНАТЕЛЬНО не заводила, с доводом «слабый gold
  портит precision сильнее, чем пропущенный minor — recall». Довод был НЕВЕРЕН, и это
  поймал ревью-контур на этом же PR. По коду метрик: знаменатель
  `precision_lower_bound` — все блокирующие предсказания независимо от разметки
  (`_precision_lb_pair`), а в числитель идут только назначения на gold major/blocker
  (`_true_positives`, `_gold_blocking_ids` фильтрует по GOLD_SEVERITIES). Значит
  блокирующее предсказание на этот дефект даёт РОВНО ТУ ЖЕ арифметику и с gold-минором,
  и без записи вовсе. Разница в другом: без записи предсказание остаётся `unlabeled`
  (`matcher.py`), `_queue_open` на неразмеченном блокирующем предсказании даёт True, и
  официальный `precision` не публикуется у ВСЕГО варианта (D9), а статус уходит в
  `pending_adjudication`. То есть пропуск делал ровно то, чего довод хотел избежать, и
  обещанного выигрыша не давал. Запись заведена `severity: minor`: в знаменатели recall
  она не попадает (там только major/blocker), precision от неё не меняется, а очередь
  остаётся закрытой.
