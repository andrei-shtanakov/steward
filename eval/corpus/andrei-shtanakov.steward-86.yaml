notes: |-
  Кейс заведён РУКАМИ (source: manual) 2026-09-18: ревью ai-prosto на PR 86 нет
  (он старше ревью-контура), а генератор черновиков без него работать не может.
  Для `large` это и не нужно: измеряется не качество находок, а сам отказ
  гардрейла — ревьюер не вызывается вовсе, поэтому gold-дефектов у кейса нет
  по построению.

  Зачем кейс нужен: DoD пункта review-kit-eval-harness требует «с дефектами,
  чистые, КРУПНЫЕ», и без такого кейса путь гардрейла корпусом не покрыт вовсе.
  Потолки живут в `build-prompt.sh` (400000 байт / 30 файлов) — `local.sh`
  своих значений не имеет и пробрасывает только оверрайды оператора, так что
  умолчания действуют.

  Замер сделан на ТОМ диапазоне, который меряет кит. Это не то же самое, что
  `base_sha..head_sha`: `local.sh` сам берёт `mb=$(git merge-base "$base"
  "$head_sha")` и строит диф как `mb..head_sha`, и ту же merge-base берёт
  предпроверка раннера. Для этого кейса `merge-base(base_sha, head_sha)`
  РАВНА `base_sha` (сверено), поэтому оба диапазона совпадают и числа
  относятся именно к входу потолка: 35 файлов против 30 и 527980 байт против
  400000 — превышены ОБА. Отсюда `expected_outcome: guardrail_rejection` без
  `local_args`: потолок обязан отказать до вызова ревьюера, и это правильный
  исход, а не сбой. Оговорка на будущее: у смерженного PR, чей master ушёл
  вперёд между ответвлением и мержем, эти диапазоны РАЗОШЛИСЬ бы, и замер по
  `base..head` был бы завышен обращёнными master-only изменениями — мерить
  надо от merge-base (находка ревью-контура на этом же PR, minor).

  `base_sha` — первый родитель merge-коммита PR (`a4efcc16^1`), а НЕ merge-base
  с ТЕКУЩИМ master: PR влит, голова master содержит сам PR, и наивный
  `git merge-base origin/master <head>` даёт саму голову, то есть пустой
  диапазон. Проверено на этом кейсе прямо при заведении — ровно тот капкан, о
  котором предупреждает §1 дока. Уточнение: `resolve_review_base` берёт
  первого родителя лишь КАНДИДАТОМ и доводит его до базы через
  `compare/<кандидат>...<head>` → `merge_base_commit.sha`; здесь эти значения
  совпали (см. абзац выше), поэтому поле несёт настоящую merge-base диапазона,
  как и подписывает его §5 спеки.

  blocking_complete: false — сознательно: 35 файлов и полмегабайта диффа
  сплошь не прочитаны, а для исхода `guardrail_rejection` это и не требуется
  (перечень блокирующих дефектов не участвует: предсказаний не будет).
