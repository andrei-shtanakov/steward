  scenario: 'Opt-in режим оставляет merge-broker с гарантированно красным rollup. Патч меняет
    условие запроса ревью с `(!draft || есть лейбл)` на `есть лейбл`, поэтому ЛЮБОЙ PR без лейбла
    `codex-review` получает синтетический `{"review_deferred": true}`, а job `report` завершается
    кодом 1 («красное везде, где нет годного вердикта» — его инвариант). Обычный PR создаётся
    без лейбла, проходит предусмотренное умолчанием терминальное ревью `review-pr.sh` от ai-prosto
    и передаётся существующему merge-broker. Навешивание лейбла после ревью само workflow не запускает
    (`labeled` в триггерах намеренно отсутствует), поэтому красный чек остаётся на текущем SHA.
    Брокер читает АГРЕГАТ всех чеков: `[ "$rollup" = SUCCESS ] || refuse`, — advisory-чек в rollup
    неотличим от обязательного.'
