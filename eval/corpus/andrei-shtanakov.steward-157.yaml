- id: D-andrei-shtanakov.steward-157-2
  severity: minor
  file: scripts/review/collect-context.sh
  line_hint: 228
  scenario: 'Обратная косая в пути — glob-спецсимвол pathspec: при наличии «соседа»
    без `\` ls-tree вернёт две записи, и легитимный путь будет отвергнут как «разрешился
    не в себя» (confidence: medium). Патч явно заявляет поддержку имён с `\` (`test_c_quoted_ascii_names_resolve_to_themselves`,
    `docs/back\slash.md`). `git ls-tree -- <path>` без `--literal-pathspecs` трактует
    `<path>` как pathspec, а `\` в git входит в GLOB_SPECIAL наряду с `*?[` — хвост
    после первого `\` матчится через wildmatch, где `\s` означает литеральный `s`.
    Литеральное совпадение (`match_entry`) проверяется первым, поэтому сам `docs/back\slash.md`
    находится; но если в base рядом лежит `docs/backslash.md`, он тоже матчится по
    wildcard, и `ls-tree` печатает ДВЕ записи. Вход: манифест с `docs/back\slash.md`,
    в дереве base есть и `docs/back\slash.md`, и `docs/backslash.md`.'
  evidence:
  - scripts/review/collect-context.sh:219
  - scripts/review/collect-context.sh:125
  - scripts/review/collect-context.sh:200
  - tests/review/test_collect_context.py:627
  match:
    files:
    - scripts/review/collect-context.sh
    line_window: 40
    keywords_any:
    - спецсимвол
