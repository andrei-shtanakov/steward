  scenario: 'Docstring теста утверждает механизм (`-c core.quotePath=false`), которого
    в скрипте нет — используется `ls-tree -z` (confidence: high). Мейнтейнер читает
    `test_non_ascii_path_resolves_to_itself` как объяснение, почему не-ASCII путь
    проходит структурную проверку: docstring говорит «Оба вызова ls-tree идут с `-c
    core.quotePath=false`, как уже делает local.sh». В итоговом дереве ни один вызов
    `ls-tree` в collect-context.sh этот флаг не передаёт — механизм заменён на `-z
    | tr ''\0'' ''\n''` (коммит 2971726), и комментарий скрипта в строках 103–109
    прямо объясняет, почему `core.quotePath=false` НЕ достаточно (`"` и `\` квотируются
    всегда). Соседний тест (строка 629–633) описывает актуальный механизм верно; первый
    — устаревшую версию.'
