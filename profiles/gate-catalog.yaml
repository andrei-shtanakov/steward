# Gate catalog v1 — SSOT for governance gate identity (design decision 2026-08-08).
#
# A gate is a named governance check that blocks or warns in gate-check. Every
# gate entry is immutable by slug: slug cannot be renamed or reused; a gate
# flagged `deprecated` carries a `since` date and exactly one `replacement`
# pointing to its successor. The catalog is versioned; the version field bumps
# on any change to the composition (new gates, deprecations, deletions).
#
# Gate obligations ('quality' | 'approval') reflect the *intent* of the check:
# quality = correctness/completeness gate (gate-check concern); approval =
# evidence/authorization gate (separate governance concern, not implemented yet).
# The active set ('status: active') forms the v1 contract; no other status
# appears in runtime use. GC-APPROVAL-MISSING is the only declared gate — it
# marks an unimplemented obligation that must be handled by governance policy.
#
# Stages are profile/policy-scoped contexts that select which gate applies
# (e.g., "authoring" vs "release"). Each active gate declares which stages
# accept it (via `stages` list); a stage not listed for a gate means the gate
# is inactive in that context.
#
# applicable_roles: null means the gate has no role restriction — the check
# runs against the artifact or bundle, not a specific role. When a gate *does*
# need role dispatch (future), it will list roles here; at present, all 19
# active gates are role-agnostic. GC-APPROVAL-ROLE is intentionally absent —
# the boundary between this catalog (gate identity) and approval/authorization
# policy (who can approve what) requires a separate design decision and is out
# of scope for v1.
#
# Approval model: catalog = data artifact; ownership = the gate-check engine;
# changes = PR review + merge (like profiles/roles.yaml, profiles/risk-model.yaml).
# Provenance: design decision by @id:oq-1-approval-evidence (2026-08-08).

version: 1

obligation_vocabulary:
  - quality
  - approval

stage_vocabulary:
  - authoring
  - release

gates:
  GC-ARCH-CONFORMANCE:
    obligation: quality
    status: active
    title: "conformance verdict or finding violates stage policy"
    stages: [authoring, release]
    applicable_roles: null

  GC-ARCH-EVIDENCE:
    obligation: quality
    status: active
    title: "component/interface/constraint lacks evidence"
    stages: [authoring, release]
    applicable_roles: null

  GC-ARCH-SCHEMA:
    obligation: quality
    status: active
    title: "manifest unparseable or schema-invalid"
    stages: [authoring, release]
    applicable_roles: null

  GC-BEH-COVERAGE:
    obligation: quality
    status: active
    title: "Must/Should requirement lacks coverage"
    stages: [authoring, release]
    applicable_roles: null

  GC-BEH-TRACE:
    obligation: quality
    status: active
    title: "scenario does not trace to requirement"
    stages: [authoring, release]
    applicable_roles: null

  GC-CHECK-PLANNED:
    obligation: quality
    status: active
    title: "blocking scenario missing check binding"
    stages: [authoring, release]
    applicable_roles: null

  GC-COMPILE:
    obligation: quality
    status: active
    title: "decomposition block contains invalid dep-link"
    stages: [authoring, release]
    applicable_roles: null

  GC-COMPLETENESS:
    obligation: quality
    status: active
    title: "required artifact missing from bundle"
    stages: [authoring, release]
    applicable_roles: null

  GC-DUP:
    obligation: quality
    status: active
    title: "artifact node claimed twice"
    stages: [authoring, release]
    applicable_roles: null

  GC-GIT-BRANCH:
    obligation: quality
    status: active
    title: "approved without default-branch confirmation"
    stages: [authoring, release]
    applicable_roles: null

  GC-GIT-ROLE:
    obligation: quality
    status: active
    title: "approved without owner-role approval"
    stages: [authoring, release]
    applicable_roles: null

  GC-META:
    obligation: quality
    status: active
    title: "malformed frontmatter"
    stages: [authoring, release]
    applicable_roles: null

  GC-STAGE:
    obligation: quality
    status: active
    title: "stage not recognized in profile"
    stages: [authoring, release]
    applicable_roles: null

  GC-STALE:
    obligation: quality
    status: active
    title: "upstream changed since approval"
    stages: [authoring, release]
    applicable_roles: null

  GC-STALE-KEY:
    obligation: quality
    status: active
    title: "upstream_hashes pins unknown upstream"
    stages: [authoring, release]
    applicable_roles: null

  GC-STALE-UNPINNED:
    obligation: quality
    status: active
    title: "approved upstream_hashes entry missing"
    stages: [authoring, release]
    applicable_roles: null

  GC-TRACE:
    obligation: quality
    status: active
    title: "traces_to does not resolve upstream"
    stages: [authoring, release]
    applicable_roles: null

  GC-TRACE-EMPTY:
    obligation: quality
    status: active
    title: "traces_to link absent from downstream"
    stages: [authoring, release]
    applicable_roles: null

  GC-UPSTREAM:
    obligation: quality
    status: active
    title: "approved before upstream"
    stages: [authoring, release]
    applicable_roles: null

  GC-APPROVAL-MISSING:
    obligation: approval
    status: declared
    title: "required merge evidence is absent"
    stages: [release]
    applicable_roles: null
