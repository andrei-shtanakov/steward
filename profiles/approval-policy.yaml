# Закрытая классификация merge-акторов (решение владельца 2026-08-08).
# Точное совпадение, никаких default-human: неизвестный актор = unknown,
# unknown НЕ удовлетворяет release-policy — и остаётся fail-closed независимо
# от значения `agent_merge_allowed` ниже.
version: 1
human_identities:
  - github:andrei-shtanakov
# Форма строки — БЕЗ суффикса `[bot]`, и это не косметика. Провайдер фактов
# собирает identity как `github:{login}` из GraphQL (`approvalfacts.py`), а GraphQL
# у Bot-актора отдаёт голый слаг: живой мерж 2026-08-20 дал `merge-broker`, тогда как
# REST на том же мерже — `merge-broker[bot]`. `classify_actor` сверяет ТОЧНЫМ
# сравнением, поэтому запись с суффиксом не совпадёт никогда — и это незаметно:
# классификация всё равно вернёт `agent` по хинту "Bot", а заявленная личность
# останется мёртвой строкой. Проверять надо не «работает ли классификация», а
# совпала ли строка. Запись `dependabot` приведена к той же грамматике по выводу из
# наблюдения выше (живого мержа dependabot не было); от неё, как и от merge-broker,
# классификация не зависит — обе распознаются хинтом.
agent_identities:
  - github:dependabot
  - github:merge-broker

# Удовлетворяет ли агентский мерж release-policy. Значение политики, а не
# константа кода (steward#69).
#
# Запрет остаётся, но причина СМЕНИЛАСЬ 2026-08-20 — прежняя снята, и оставлять её
# здесь значило бы ссылаться на закрытое возражение:
#   * ~~ADR-ECO-008 в статусе `proposed`~~ — ратифицирован (prograph-vault#80);
#   * ~~различимой merge-личности не существует~~ — существует и доказана живой
#     приёмкой (steward#75, `merged_by = merge-broker[bot]`, `type: Bot`;
#     леджер — `docs/evidence/2026-08-20-i4-live-acceptance/`).
#
# Действующая причина одна: **I4 выполнен не целиком**. По ADR-ECO-004 I4 — это
# detection loop, наблюдатель агентских мержей, а не только их отличимость;
# отличимость лишь предпосылка. Наблюдатель живёт в dispatcher
# (`todo://dispatcher/agent-merge-observability`) и не сделан. Пока его нет,
# действует оговорка D6: прогон обязан вести себя как `merge_authority: human`.
agent_merge_allowed: false
