# Закрытая классификация merge-акторов (решение владельца 2026-08-08).
# Точное совпадение, никаких default-human: неизвестный актор = unknown,
# unknown НЕ удовлетворяет release-policy — и остаётся fail-closed независимо
# от значения `agent_merge_allowed` ниже.
version: 1
human_identities:
  - github:andrei-shtanakov
# Форма строки — БЕЗ суффикса `[bot]`, и это не косметика. Провайдер фактов
# собирает identity как `github:{login}` из GraphQL (`approvalfacts.py`), а GraphQL
# у Bot-актора отдаёт голый слаг: живой мерж 2026-08-20 дал `merge-broker`, тогда как
# REST на том же мерже — `merge-broker[bot]`. `classify_actor` сверяет ТОЧНЫМ
# сравнением, поэтому запись с суффиксом не совпадёт никогда — и это незаметно:
# классификация всё равно вернёт `agent` по хинту "Bot", а заявленная личность
# останется мёртвой строкой. Проверять надо не «работает ли классификация», а
# совпала ли строка. Запись `dependabot` приведена к той же грамматике по выводу из
# наблюдения выше (живого мержа dependabot не было); от неё, как и от merge-broker,
# классификация не зависит — обе распознаются хинтом.
agent_identities:
  - github:dependabot
  - github:merge-broker
  # DarkFactory-мержер (ADR-ECO-011 D3, 2026-08-30): агентский мерж исполняется
  # от учётки ai-prosto — той же, что публикует терминальный ревью-вердикт, —
  # и `merged_by` становится наблюдаемым различителем agent/human без нового
  # рантайма. Эта строка НЕСЁТ ВЕС, в отличие от двух над ней: ai-prosto —
  # machine user, а не GitHub App, поэтому GraphQL отдаёт `__typename: User`,
  # и хинт `"Bot"` его НЕ классифицирует. Убрать строку — значит вернуть
  # ai-prosto в `unknown` (направление безопасное, fail-closed, но поведение
  # меняется целиком), а не «положиться на форму имени», как с merge-broker.
  - github:ai-prosto

# Удовлетворяет ли агентский мерж release-policy. Значение политики, а не
# константа кода (steward#69).
#
# **Разрешён с 2026-08-31** (ADR-ECO-011 «DarkFactory», ратифицирован 2026-08-30).
# Довод переписан целиком, а не дополнен: обе прежние причины запрета закрыты, и
# оставлять их здесь значило бы ссылаться на снятые возражения.
#   * ~~ADR-ECO-008 в статусе `proposed`~~ — ратифицирован (prograph-vault#80);
#   * ~~различимой merge-личности не существует~~ — существует и доказана живой
#     приёмкой (steward#75, `merged_by = merge-broker[bot]`, `type: Bot`;
#     леджер — `docs/evidence/2026-08-20-i4-live-acceptance/`);
#   * ~~I4 выполнен не целиком: detection loop (наблюдатель агентских мержей у
#     dispatcher) не сделан, и по оговорке ADR-ECO-004 D6 прогон обязан вести
#     себя как `merge_authority: human`~~ — снято ADR-ECO-011 OQ-1: владелец
#     постановил, что для DarkFactory `merged_by`-аудита (`gh pr list --json
#     mergedBy`) достаточно, отдельный дашборд в dispatcher не является
#     предусловием. Это ровно то возражение, которое несло это поле.
#
# Основание разрешения — D1 того же ADR: мерж по умолчанию делает агент на ОБОИХ
# типах сессий, и гейт обязан уметь принять ровно это. Условия мержа при этом не
# ослаблены и живут не здесь: approve собранного ревью, зелёные обязательные
# проверки, fail-closed при неполных данных GitHub, и всегда человек — на
# authority-root путях (в том числе на ЭТОМ файле), на PR без evidence базового
# слоя и в репо с внешним upstream.
#
# Что это поле НЕ ослабляет: `unknown` остаётся fail-closed независимо от значения
# (см. шапку файла) — разрешение распространяется ровно на корректно
# классифицированного `agent`, то есть на личность из `agent_identities` или с
# хинтом `Bot`, и ни на кого больше.
#
# Пересмотр — не по календарю: ADR-ECO-011 OQ-1 назначает его «при первом
# инциденте». Инцидент здесь — агентский мерж, который не должен был состояться;
# обнаруживается тем же `merged_by`-аудитом.
agent_merge_allowed: true

# Срок действия наблюдения approval-facts (§6.4 спеки v2). Не эвристика
# читателя по возрасту, а нормативная lease продюсера: после неё actor_class
# перестаёт быть операционным наблюдением, и D6 переводит authority в human.
approval_facts_lease_seconds: 86400
