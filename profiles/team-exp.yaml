# Experimental team profile: `team` + the behaviour-spec gate between requirements
# and design/acceptance (ADR behaviour-architecture-lifecycle, Phase 1 slice item 1;
# golden run: ../_cowork_output/golden-run-ws005/). `team` and `lite` stay untouched.
# `design` keeps its name — the design → architecture rename is an open ADR question
# (waits for a second signal); it only gains the behaviour-spec upstream edge here.
profile: team-exp
# solo_auto_approve: WS-003 (required-owner-review) закрыт как structurally
# unsatisfiable solo. Что ЭНФОРСИТ gate-check при true: GC-GIT-ROLE выключен,
# GC-GIT-BRANCH проверяет только присутствие файла на default branch — тип
# мержа (человек/агент) не различается. «Аппрув = PR-merge человеком» — это
# operating policy владельца, не машинная гарантия; typed merge evidence
# (human_merge/agent_merge, ADR-ECO-004) появится с merge evidence policy (TODO §6).
solo_auto_approve: true
artifacts:
  - {id: charter,        template: charter.md,        owner_role: product,    upstream: []}
  - id: requirements
    template: requirements.md
    owner_role: product
    # reviewer_roles declares the required reviewer role (DEC-007). It is NOT
    # machine-enforced yet: enforcement needs a PR-review evidence source
    # (review-facts), which does not exist — merge-actor evidence (mergedBy)
    # is a different fact and does not prove a QA review happened.
    reviewer_roles: [architects]
    upstream: [charter]
  - id: behaviour-spec
    template: behaviour-spec.md
    owner_role: product
    reviewer_roles: [qa]
    upstream: [requirements]
  - {id: design,         template: design.md,         owner_role: architects, upstream: [requirements, behaviour-spec]}
  - {id: acceptance,     template: acceptance.md,     owner_role: qa,         upstream: [requirements, behaviour-spec]}
  - {id: decomposition,  template: decomposition.md,  owner_role: tech-lead,  upstream: [design, acceptance]}
  - {id: tasks,           owner_role: stream-owner,    upstream: [decomposition], delegate: spec-runner, per: workstream}
compile:
  decomposition: {to: maestro,     artifact: project.yaml}
  tasks:          {to: spec-runner, artifact: tasks.md}
