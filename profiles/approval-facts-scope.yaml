# Явный охват для регулярного сбора `approval-facts/v2` (Stage A0).
#
# Список, а не «недавние PR», и это требование контракта, а не осторожность:
# заголовок бандла несёт `scope` и `scope_sha256`, то есть публикует, что
# именно было спрошено. Правило, выведенное отсюда: то, чего нет в списке,
# остаётся `no-data` у потребителя — честное «не спрашивали», а не тихий ноль.
#
# Stage A0 намеренно steward-only. Продюсер пишет
# `<checkout>/.steward/approval_facts.jsonl`, а `.steward/` объявлен локальным
# инструментальным скрэтчем (`.gitignore`, секция «Local agent tooling») пока
# только здесь. Подключать dispatcher и maestro — после их собственного
# согласия на generated-каталог в их дереве, отдельными PR в их репозитории;
# этот файл менять из скрипта нельзя, как и их `.gitignore`.
#
# Stage B заменит этот список охватом, который формирует потребитель.

version: 1

repositories:
  - repo: andrei-shtanakov/steward
    # Путь относительно `--workspace-root`; раннер резолвит и проверяет, что
    # это git-корень, что `origin` совпадает с `repo` и что путь не вышел за
    # пределы workspace-root. Дефолтный `.` у продюсера не используется никогда.
    checkout: steward
    # Смесь ради soak, и она подобрана, а не взята подряд:
    #   75 — слит merge-broker'ом, даёт `actor_class: agent`;
    #   74, 90, 92, 93, 94 — слиты человеком, дают `human`;
    #   95 — открыт, даёт `not_merged`.
    # Без агентских мержей бандл не содержал бы того самого различения, ради
    # которого весь контур и строится, и первый потребитель проверял бы его
    # на данных, где различать нечего.
    prs: [74, 75, 90, 92, 93, 94, 95]
